name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing the upload.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile is committed, so this is `npm install`, not `npm ci`.
      - run: npm install --no-audit --no-fund

      - run: npm run build

      # upload.mjs accepts YC_* or AWS_*/S3_* names; pass both so the secrets
      # can mirror .env either way. A missing secret is an empty string, and
      # the script falls through to the other name.
      - run: npm run upload
        env:
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
          YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          YC_ENDPOINT: ${{ secrets.YC_ENDPOINT }}
          YC_REGION: ${{ secrets.YC_REGION }}
